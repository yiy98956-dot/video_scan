server:
  port: 8080

spring:
  application:
    name: video-platform

  # ─── MySQL ───
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/video_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:your_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:20}
      minimum-idle: ${DB_MIN_IDLE:5}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      leak-detection-threshold: 60000

  # ─── Redis ───
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 30000
      lettuce:
        pool:
          max-active: ${REDIS_MAX_ACTIVE:16}
          max-idle: ${REDIS_MAX_IDLE:8}
          min-idle: ${REDIS_MIN_IDLE:4}
          max-wait: 3000ms
        shutdown-timeout: 200ms

  # ─── 文件上传 ───
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # ─── 自动建表 ───
  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations: classpath:schema.sql

    # ─── Elasticsearch（默认关闭，开启请取消注释） ───
    elasticsearch:
      client:
        uris:
        #  - http://localhost:9200

# ─── MyBatis-Plus ───
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.videoplatform.**.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ─── JWT ───
jwt:
  secret: ${JWT_SECRET:your_jwt_secret_key_at_least_32_characters_long}
  access-token-expiration: 1800000     # 30 分钟（毫秒）
  refresh-token-expiration: 604800000  # 7 天（毫秒）

# ─── Knife4j / Swagger ───
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh-CN
    enable-swagger-models: true
    enable-document-manage: true
    enable-version: false
    enable-reload-cache-parameter: false
    enable-after-script: true
    enable-filter-multipart-api-method-type: POST
    enable-request-cache: true
    enable-host: false
    enable-host-text: 127.0.0.1:8080
    enable-home-custom: true
    home-custom-path: /doc.html

# ─── C++ 采集服务 ───
cpp:
  service:
    base-url: http://localhost:54567

# ─── 加密配置 ───
crypto:
  enabled: ${CRYPTO_ENABLED:false}  # 是否启用加密（生产环境建议开启）
  secret: ${CRYPTO_SECRET:}  # 加密密钥（生产环境必须设置，至少32位）

# ─── 头像上传 ───
avatar:
  upload-dir: ./avatars
  max-size: 2097152  # 2MB

# ─── Logging ───
logging:
  level:
    root: WARN
    com.videoplatform: INFO
    org.springframework: WARN
    org.springframework.security: WARN
    com.baomidou.mybatisplus: WARN
